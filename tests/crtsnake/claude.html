<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ЗМЕЙКА</title>
<style>
:root{--bg:#0b0b1a;--ink:#f4f4d0;--acc:#ffd800;--red:#ff3b3b;--grn:#38e060;--dim:#6a6a9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Courier New",Courier,monospace;font-weight:900;text-transform:uppercase;letter-spacing:2px;overflow:hidden;overscroll-behavior:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
.view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(64px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));overflow-y:auto}
.view.on{display:flex}
.btn,a.btn{display:inline-block;background:var(--bg);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 #000,4px 4px 0 2px var(--dim);padding:8px 12px;font:inherit;letter-spacing:2px;text-transform:uppercase;text-decoration:none;cursor:pointer;font-size:14px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.sel{background:var(--acc);color:#000;border-color:var(--acc)}
#back{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:20}
h1{margin:0 0 4px;font-size:clamp(40px,14vw,72px);color:var(--grn);text-shadow:4px 4px 0 #000,0 0 0 var(--grn),6px 6px 0 #14602a;line-height:1}
.sub{color:var(--acc);margin-bottom:14px;font-size:13px}
.row{width:100%;max-width:440px;margin:6px 0}
.row .lb{font-size:12px;color:var(--dim);margin-bottom:5px}
.grp{display:flex;flex-wrap:wrap;gap:8px}
#play{margin:14px 0 6px;font-size:22px;padding:12px 28px;background:var(--grn);color:#000;border-color:var(--grn)}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.hint{font-size:11px;color:var(--dim);text-align:center;margin-top:6px;max-width:440px;line-height:1.5}
#hud{width:var(--w);display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:10px;gap:6px}
#hud b{color:var(--acc)}
#wrap{--w:min(94vw,calc(100dvh - 150px),520px);position:relative;width:var(--w);height:var(--w);border:6px solid var(--ink);box-shadow:6px 6px 0 #000,0 0 0 3px var(--dim);background:#000;touch-action:none}
#game{--w:min(94vw,calc(100dvh - 150px),520px)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;background:rgba(11,11,26,.86);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px}
.ov.on{display:flex}
.ov h2{margin:0;font-size:clamp(26px,9vw,44px);color:var(--red);text-shadow:3px 3px 0 #000}
.ov p{margin:0;font-size:14px}
</style>
</head>
<body>
<a class="btn" id="back" href="../../index.html">◄ Назад</a>

<section class="view on" id="menu">
  <h1>ЗМЕЙКА</h1>
  <div class="sub">★ РЕТРО-АРКАДА ★</div>
  <div id="opts" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <button class="btn" id="play">▶ СТАРТ</button>
  <div class="hint">ПК: WASD / СТРЕЛКИ · P — ПАУЗА · ESC — МЕНЮ<br>ТЕЛЕФОН: СВАЙПЫ ПО ЭКРАНУ</div>
</section>

<section class="view" id="game">
  <div id="hud">
    <span>СЧЁТ <b id="sc">0</b></span>
    <span>РЕКОРД <b id="hi">0</b></span>
    <button class="btn" id="pz" style="padding:4px 10px">II</button>
  </div>
  <div id="wrap">
    <canvas id="cv" width="320" height="320"></canvas>
    <div class="ov on" id="ready"><p class="blink">ГОТОВ?</p><p>НАЖМИ WASD<br>ИЛИ СВАЙПНИ</p></div>
    <div class="ov" id="paused"><h2 style="color:var(--acc)">ПАУЗА</h2><button class="btn" id="res">▶ ДАЛЬШЕ</button></div>
    <div class="ov" id="over">
      <h2 class="blink">GAME OVER</h2>
      <p>СЧЁТ: <b id="fs" style="color:var(--acc)">0</b></p>
      <p id="nr" style="color:var(--grn)"></p>
      <button class="btn sel" id="again">↻ ЕЩЁ РАЗ</button>
      <button class="btn" id="tomenu">☰ МЕНЮ</button>
    </div>
  </div>
  <div class="hint">СВАЙПАЙ ПО ЭКРАНУ ИЛИ ЖМИ WASD</div>
</section>

<script>
const $=s=>document.querySelector(s),N=20,C=16,cv=$('#cv'),g=cv.getContext('2d');
const SK=[{n:'ЗЕЛЁНАЯ',b:'#38e060',h:'#14a03c',l:'#a8ffb8'},{n:'ЯНТАРЬ',b:'#ffb000',h:'#c07000',l:'#ffe08a'},{n:'ЛЁД',b:'#40d8ff',h:'#1088b0',l:'#c0f4ff'},{n:'ТЁМНАЯ',b:'#0f380f',h:'#071c07',l:'#306230'}];
const FD=[{n:'LCD',a:'#9bbc0f',b:'#8bac0f',w:'#306230',wl:'#0f380f'},{n:'НОЧЬ',a:'#10102a',b:'#161638',w:'#5a5ad0',wl:'#2a2a80'},{n:'ПУСТЫНЯ',a:'#e8c88a',b:'#dfbd7c',w:'#8a4a2a',wl:'#5a2a10'}];
const FOOD=[{n:'ЯБЛОКО',m:["....bg..","...bgg..",".rrrrrr.","rrwrrrrr","rrwrrrrr","rrrrrrrr",".rrrrrr.","..rr.rr."]},
{n:'ВИШНЯ',m:["......g.",".....gg.","..b.g.g.",".rrb..g.","rwrr.rr.","rrrrrwrr","rrrr.rrr",".rr...r."]},
{n:'ЗВЕЗДА',m:["...yy...","...yy...","yyyyyyyy",".yywwyy.","..yyyy..","..yyyy..",".yy..yy.","yy....yy"]}];
const PAL={r:'#e03030',g:'#38b000',b:'#7a4a1a',w:'#fff',y:'#f8d800'};
const OPT=[{k:'diff',t:'СЛОЖНОСТЬ',v:['ЛЁГКО','НОРМА','ХАРД']},{k:'mode',t:'РЕЖИМ',v:['КЛАССИКА','БЕЗ СТЕН','ЛАБИРИНТ']},
{k:'snake',t:'ЗМЕЯ',v:SK.map(x=>x.n)},{k:'field',t:'КАРТА',v:FD.map(x=>x.n)},{k:'food',t:'ЕДА',v:FOOD.map(x=>x.n)},{k:'snd',t:'ЗВУК',v:['ВКЛ','ВЫКЛ']}];
const BASE=[150,110,75];
let S={diff:1,mode:0,snake:3,field:0,food:0,snd:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('snk_set')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('snk_set',JSON.stringify(S))}catch(e){}};

/* меню */
const box=$('#opts');
OPT.forEach(o=>{const r=document.createElement('div');r.className='row';r.innerHTML='<div class="lb">'+o.t+'</div><div class="grp"></div>';
 const gr=r.lastChild;
 o.v.forEach((t,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=t;b.style.fontSize='13px';
  b.onclick=()=>{S[o.k]=i;save();mark();beep(660,.05);if(!$('#game').classList.contains('on'))draw()};gr.appendChild(b)});
 box.appendChild(r)});
function mark(){[...box.children].forEach((r,j)=>[...r.lastChild.children].forEach((b,i)=>b.classList.toggle('sel',S[OPT[j].k]===i)))}
mark();

/* звук */
let ac;function beep(f,d,t){if(S.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=t||'square';o.frequency.value=f;v.gain.value=.06;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* состояние */
let sn,dir,q,food,walls,score,hi,started,running,paused,timer;
const key=()=>'snk_hi_'+S.diff+'_'+S.mode;
const free=(x,y)=>!sn.some(s=>s.x==x&&s.y==y)&&!walls.some(w=>w.x==x&&w.y==y);
function place(){const a=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(free(x,y))a.push({x,y});if(!a.length)return null;return a[Math.random()*a.length|0]}
function reset(){
 sn=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];dir={x:1,y:0};q=[];score=0;walls=[];
 if(S.mode==2){for(let i=0;i<9;i++){const h=Math.random()<.5,l=2+(Math.random()*3|0),x=1+(Math.random()*(N-2-l)|0),y=1+(Math.random()*(N-2-l)|0);
  for(let k=0;k<l;k++){const p={x:x+(h?k:0),y:y+(h?0:k)};if(!(p.x<13&&p.y>=8&&p.y<=12))walls.push(p)}}}
 food=place();started=false;running=true;paused=false;clearTimeout(timer);
 try{hi=+localStorage.getItem(key())||0}catch(e){hi=0}
 $('#sc').textContent=0;$('#hi').textContent=hi;
 ['paused','over'].forEach(i=>$('#'+i).classList.remove('on'));$('#ready').classList.add('on');draw()}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==id))}
function start(){show('game');reset()}
const delay=()=>Math.max(45,BASE[S.diff]-Math.min(score/10*1.5,35));
function step(){if(!running||paused)return;tick();if(running)timer=setTimeout(step,delay())}
function tick(){
 if(q.length)dir=q.shift();
 let nx=sn[0].x+dir.x,ny=sn[0].y+dir.y;
 if(S.mode==1){nx=(nx+N)%N;ny=(ny+N)%N}else if(nx<0||ny<0||nx>=N||ny>=N)return die();
 const ate=food&&nx==food.x&&ny==food.y,body=ate?sn:sn.slice(0,-1);
 if(body.some(s=>s.x==nx&&s.y==ny)||walls.some(w=>w.x==nx&&w.y==ny))return die();
 sn.unshift({x:nx,y:ny});
 if(ate){score+=10*(S.diff+1);$('#sc').textContent=score;beep(880,.07);food=place();if(!food){draw();return die()}}else sn.pop();
 draw()}
function die(){running=false;clearTimeout(timer);beep(150,.4,'sawtooth');draw();
 let nr=score>hi&&score>0;if(nr){hi=score;try{localStorage.setItem(key(),hi)}catch(e){}}
 $('#hi').textContent=hi;$('#fs').textContent=score;$('#nr').textContent=nr?'★ НОВЫЙ РЕКОРД! ★':'';$('#over').classList.add('on')}
function setPause(p){if(!running||!started)return;paused=p;$('#paused').classList.toggle('on',p);clearTimeout(timer);if(!p)timer=setTimeout(step,delay())}

/* ввод */
function turn(d){if(!running||paused||!$('#game').classList.contains('on'))return;
 const l=q.length?q[q.length-1]:dir;if((d.x==-l.x&&d.y==-l.y)||(d.x==l.x&&d.y==l.y))return;
 if(q.length<2)q.push(d);
 if(!started){started=true;$('#ready').classList.remove('on');timer=setTimeout(step,delay())}}
const K={KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]};
addEventListener('keydown',e=>{
 if(K[e.code]){e.preventDefault();turn({x:K[e.code][0],y:K[e.code][1]})}
 else if(e.code=='KeyP'||e.code=='Space'){e.preventDefault();if($('#game').classList.contains('on'))setPause(!paused)}
 else if(e.code=='Escape'){clearTimeout(timer);running=false;show('menu')}});
let t0;const gv=$('#game');
gv.addEventListener('touchstart',e=>{const t=e.touches[0];t0={x:t.clientX,y:t.clientY}},{passive:true});
gv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
gv.addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y;t0=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
 turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)})},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
$('#play').onclick=start;$('#again').onclick=start;$('#tomenu').onclick=()=>show('menu');
$('#pz').onclick=()=>setPause(!paused);$('#res').onclick=()=>setPause(false);

/* отрисовка */
function draw(){
 const f=FD[S.field],k=SK[S.snake];
 if(!sn){sn=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];dir={x:1,y:0};walls=[];food=null}
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){g.fillStyle=(x+y)%2?f.a:f.b;g.fillRect(x*C,y*C,C,C)}
 walls.forEach(w=>{const x=w.x*C,y=w.y*C;g.fillStyle=f.w;g.fillRect(x,y,C,C);g.fillStyle=f.wl;g.fillRect(x,y+7,C,2);g.fillRect(x,y,C,1);g.fillRect(x+7,y,2,8);g.fillRect(x+3,y+8,2,8);g.fillRect(x+11,y+8,2,8)});
 if(food)FOOD[S.food].m.forEach((r,py)=>[...r].forEach((c,px)=>{if(c!='.'){g.fillStyle=PAL[c];g.fillRect(food.x*C+px*2,food.y*C+py*2,2,2)}}));
 for(let i=sn.length-1;i>=0;i--){const s=sn[i],x=s.x*C,y=s.y*C;
  if(i){g.fillStyle=i%2?k.b:k.h;g.fillRect(x+1,y+1,C-2,C-2);g.fillStyle=k.l;g.fillRect(x+3,y+3,4,2);g.fillRect(x+3,y+3,2,4)}
  else{g.fillStyle=k.h;g.fillRect(x,y+1,C,C-2);g.fillRect(x+1,y,C-2,C);g.fillStyle=k.b;g.fillRect(x+2,y+2,C-4,C-4);
   const e=dir.x?[[dir.x>0?10:3,3],[dir.x>0?10:3,10]]:[[3,dir.y>0?10:3],[10,dir.y>0?10:3]];
   e.forEach(p=>{g.fillStyle='#fff';g.fillRect(x+p[0],y+p[1],3,3);g.fillStyle='#000';g.fillRect(x+p[0]+1+dir.x*.5|0,y+p[1]+1+dir.y*.5|0,1,1)})}}}
draw();
</script>
</body>
</html>
