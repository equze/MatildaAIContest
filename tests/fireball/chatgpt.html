<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090b15">
<title>FIREBALL — Momentum Playground</title>
<style>
  :root { color-scheme: dark; --accent:#ff853d; --muted:#9da5bd; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#080a13; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { color:#f8f8fc; touch-action:none; user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; inset:0; overflow:hidden; background:radial-gradient(ellipse at 50% 47%,#171a2c 0%,#0b0d18 52%,#070811 100%); }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #topbar { position:absolute; z-index:4; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; pointer-events:none; }
  .top-left,.top-right { display:flex; align-items:center; gap:9px; pointer-events:auto; }
  .ui-btn { color:#f4f4fb; background:rgba(17,20,35,.68); border:1px solid rgba(255,255,255,.12); border-radius:13px; padding:10px 14px; min-height:42px; font-size:13px; font-weight:650; letter-spacing:.01em; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:7px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 5px 24px #0003; cursor:pointer; transition:background .18s,border-color .18s,transform .18s; touch-action:manipulation; }
  .ui-btn:hover { background:rgba(36,40,62,.88); border-color:#ffffff35; }
  .ui-btn:active { transform:scale(.96); }
  #back { padding-inline:12px; }
  #modeBadge { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#ffc18d; padding:9px 12px; border-radius:999px; background:#ff82301a; border:1px solid #ff9b5145; }
  #hud { position:absolute; z-index:3; left:50%; top:calc(76px + env(safe-area-inset-top)); transform:translateX(-50%); text-align:center; width:min(90vw,480px); pointer-events:none; transition:opacity .25s; }
  #hint { font-size:12px; letter-spacing:.08em; color:#aeb5ca; text-shadow:0 2px 12px #000; }
  #speedWrap { margin:13px auto 0; width:112px; opacity:.72; }
  #speedLabel { font-size:9px; letter-spacing:.2em; color:#8992ad; text-transform:uppercase; margin-bottom:6px; }
  #speedTrack { height:3px; border-radius:9px; overflow:hidden; background:#ffffff16; }
  #speedFill { height:100%; width:0%; border-radius:9px; background:linear-gradient(90deg,#ff9c48,#ff4c35,#fff0a5); box-shadow:0 0 10px #ff673d; transition:width .08s linear; }
  #menu { position:absolute; z-index:8; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(ellipse at 50% 42%,rgba(23,26,44,.4),rgba(5,7,14,.82)); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); transition:opacity .28s,visibility .28s; }
  #menu.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  .panel { width:min(100%,570px); padding:clamp(24px,5vw,42px); border-radius:28px; background:linear-gradient(145deg,rgba(27,30,49,.93),rgba(12,14,25,.94)); border:1px solid rgba(255,255,255,.13); box-shadow:0 30px 100px #0009,inset 0 1px #ffffff12; text-align:center; }
  .eyebrow { color:#ff9a5d; font-size:10px; font-weight:800; letter-spacing:.28em; text-transform:uppercase; }
  h1 { margin:10px 0 8px; font-size:clamp(38px,9vw,62px); line-height:.98; letter-spacing:-.07em; font-weight:900; }
  h1 span { color:#ff8750; text-shadow:0 0 34px #ff5e3440; }
  .subtitle { margin:0 auto 27px; max-width:365px; color:#aeb4c8; font-size:13px; line-height:1.6; }
  .mode-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:left; }
  .mode-card { position:relative; overflow:hidden; min-height:130px; padding:15px 12px; border-radius:17px; border:1px solid #ffffff17; background:linear-gradient(150deg,#ffffff0d,#ffffff04); color:#f5f5fb; text-align:left; cursor:pointer; touch-action:manipulation; transition:transform .18s,border-color .18s,background .18s; }
  .mode-card:hover { transform:translateY(-3px); }
  .mode-card:active { transform:scale(.97); }
  .mode-card.selected { border-color:var(--mode); background:linear-gradient(150deg,color-mix(in srgb,var(--mode) 20%,#171a2a),#ffffff05); box-shadow:inset 0 0 25px color-mix(in srgb,var(--mode) 12%,transparent),0 0 24px color-mix(in srgb,var(--mode) 12%,transparent); }
  .mode-icon { width:28px; height:28px; border-radius:10px; margin-bottom:12px; display:grid; place-items:center; background:color-mix(in srgb,var(--mode) 22%,transparent); color:var(--mode); font-size:16px; }
  .mode-name { display:block; font-size:13px; font-weight:850; letter-spacing:.04em; }
  .mode-desc { display:block; margin-top:5px; color:#9da5bb; font-size:10px; line-height:1.4; }
  #startBtn { margin-top:17px; width:100%; min-height:51px; border:0; border-radius:15px; color:#1d1010; background:linear-gradient(100deg,#ffb36b,#ff7049); font-size:14px; font-weight:900; letter-spacing:.08em; cursor:pointer; box-shadow:0 8px 30px #ff743b30; transition:transform .18s,filter .18s; touch-action:manipulation; }
  #startBtn:hover { filter:brightness(1.08); }
  #startBtn:active { transform:scale(.98); }
  .footnote { margin-top:15px; color:#777f98; font-size:10px; }
  #bottomTip { position:absolute; z-index:3; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); color:#79829b; font-size:10px; letter-spacing:.13em; text-transform:uppercase; white-space:nowrap; pointer-events:none; opacity:.8; }
  #flash { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:0; background:radial-gradient(circle at var(--flash-x,50%) var(--flash-y,50%),#ffdfaa55,transparent 38%); }
  @media (max-width:520px) {
    #topbar { left:10px; right:10px; }
    .ui-btn { padding:9px 11px; min-height:40px; font-size:12px; border-radius:12px; }
    #modeBadge { padding:8px 10px; font-size:9px; }
    .mode-grid { gap:7px; }
    .mode-card { min-height:120px; padding:12px 9px; }
    .mode-name { font-size:11px; }
    .mode-desc { font-size:9px; }
    .panel { border-radius:22px; }
    #bottomTip { font-size:9px; letter-spacing:.08em; }
  }
  @media (max-height:610px) {
    .panel { padding:18px 24px; }
    h1 { font-size:40px; margin:7px 0 5px; }
    .subtitle { margin-bottom:14px; font-size:11px; }
    .mode-card { min-height:100px; padding:10px; }
    .mode-icon { margin-bottom:7px; }
    #startBtn { min-height:44px; margin-top:10px; }
    .footnote { margin-top:8px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Игровое поле с огненным шаром"></canvas>
  <div id="flash"></div>
  <div id="topbar">
    <div class="top-left">
      <a class="ui-btn" id="back" href="../../index.html"><span aria-hidden="true">←</span> Назад</a>
    </div>
    <div class="top-right">
      <span id="modeBadge">BASIC MODE</span>
      <button class="ui-btn" id="changeMode" type="button">Режим</button>
      <button class="ui-btn" id="resetBtn" type="button" aria-label="Перезапустить шар">↻</button>
    </div>
  </div>
  <div id="hud">
    <div id="hint">ВЕДИ ШАР · ОТПУСТИ · СМОТРИ, КАК ОН ЛЕТИТ</div>
    <div id="speedWrap"><div id="speedLabel">VELOCITY</div><div id="speedTrack"><div id="speedFill"></div></div></div>
  </div>
  <div id="bottomTip">DRAG TO MOVE · RELEASE TO LAUNCH</div>
  <div id="menu">
    <div class="panel">
      <div class="eyebrow">Momentum playground</div>
      <h1>FIRE<span>BALL</span></h1>
      <p class="subtitle">Разгони огненный шар, отпусти его и наблюдай за полётом. Чем быстрее движение — тем ярче пламя.</p>
      <div class="mode-grid" role="group" aria-label="Выбор режима">
        <button class="mode-card selected" data-mode="basic" style="--mode:#ff9855" type="button">
          <span class="mode-icon">🔥</span><span class="mode-name">BASIC</span><span class="mode-desc">Плавная физика и огненный след</span>
        </button>
        <button class="mode-card" data-mode="ultra" style="--mode:#ff4c4c" type="button">
          <span class="mode-icon">⚡</span><span class="mode-name">ULTRA</span><span class="mode-desc">Мощный отскок и жаркое поле</span>
        </button>
        <button class="mode-card" data-mode="crazy" style="--mode:#c78bff" type="button">
          <span class="mode-icon">✦</span><span class="mode-name">CRAZY</span><span class="mode-desc">Радужный хаос и странные эффекты</span>
        </button>
      </div>
      <button id="startBtn" type="button">ЗАПУСТИТЬ ИГРУ <span aria-hidden="true">→</span></button>
      <div class="footnote">Можно играть мышью или одним пальцем</div>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: true });
  const menu = document.getElementById('menu');
  const modeBadge = document.getElementById('modeBadge');
  const speedFill = document.getElementById('speedFill');
  const flash = document.getElementById('flash');
  const cards = [...document.querySelectorAll('.mode-card')];
  const modes = {
    basic: { name:'BASIC', radius:14, bounce:.78, drag:.997, gravity:0, shake:3.5, trail:1, hue:false, hot:false, particles:1 },
    ultra: { name:'ULTRA', radius:21, bounce:.91, drag:.999, gravity:0, shake:8, trail:1.65, hue:false, hot:true, particles:1.8 },
    crazy: { name:'CRAZY', radius:16, bounce:.86, drag:.998, gravity:0, shake:5.5, trail:1.4, hue:true, hot:false, particles:1.55 }
  };
  let mode = 'basic';
  let cfg = modes[mode];
  let width = 0, height = 0, dpr = 1;
  let running = false;
  let lastTime = 0;
  let elapsed = 0;
  let shake = 0;
  let hue = 0;
  let pointer = null;
  let selectedMode = 'basic';
  const particles = [];
  const effects = [];
  const stars = [];
  const ball = { x: innerWidth/2, y: innerHeight/2, vx:0, vy:0, r:14, held:false, speed:0, spin:0 };

  const rand = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const hypot = Math.hypot;

  function resize() {
    const oldW = width || innerWidth, oldH = height || innerHeight;
    width = Math.max(1, innerWidth); height = Math.max(1, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width*dpr); canvas.height = Math.round(height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ball.x = clamp(ball.x/oldW*width, ball.r, width-ball.r);
    ball.y = clamp(ball.y/oldH*height, ball.r, height-ball.r);
    makeStars();
  }
  function makeStars() {
    stars.length = 0;
    const count = Math.floor(width*height/15000);
    for(let i=0;i<count;i++) stars.push({x:Math.random()*width,y:Math.random()*height,r:rand(.4,1.4),a:rand(.12,.45),p:rand(0,Math.PI*2)});
  }
  function applyMode(next) {
    mode = next; cfg = modes[mode]; ball.r = cfg.radius;
    ball.x = clamp(ball.x, ball.r+3, width-ball.r-3);
    ball.y = clamp(ball.y, ball.r+3, height-ball.r-3);
    modeBadge.textContent = cfg.name + ' MODE';
    modeBadge.style.color = mode==='ultra' ? '#ff8a8a' : mode==='crazy' ? '#d5aaff' : '#ffc18d';
    modeBadge.style.background = mode==='ultra' ? '#ff41411c' : mode==='crazy' ? '#ac6cff1c' : '#ff82301a';
    modeBadge.style.borderColor = mode==='ultra' ? '#ff676745' : mode==='crazy' ? '#bd82ff55' : '#ff9b5145';
  }
  function showMenu() {
    running = false; menu.classList.remove('hidden');
    cards.forEach(c => c.classList.toggle('selected', c.dataset.mode===mode));
    selectedMode = mode;
  }
  function startGame() {
    applyMode(selectedMode); menu.classList.add('hidden'); running = true;
    ball.vx = 0; ball.vy = 0; ball.held = false; particles.length = 0; effects.length = 0;
    ball.x = width/2; ball.y = height/2; elapsed = 0;
  }
  function resetBall() {
    ball.x = width/2; ball.y = height/2; ball.vx = 0; ball.vy = 0; ball.held = false;
    pointer = null; particles.length = 0; effects.length = 0; shake = 0;
  }
  cards.forEach(card => card.addEventListener('click', () => {
    selectedMode = card.dataset.mode;
    cards.forEach(c => c.classList.toggle('selected', c===card));
  }));
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('changeMode').addEventListener('click', showMenu);
  document.getElementById('resetBtn').addEventListener('click', resetBall);

  function getPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: clamp(e.clientX-rect.left, ball.r, width-ball.r), y: clamp(e.clientY-rect.top, ball.r, height-ball.r), t: performance.now() };
  }
  function pointerDown(e) {
    if(!running || !menu.classList.contains('hidden')) return;
    const p = getPoint(e);
    if(hypot(p.x-ball.x,p.y-ball.y) > Math.max(ball.r*3,52)) return;
    e.preventDefault();
    pointer = { x:p.x,y:p.y,t:p.t,vx:0,vy:0 };
    ball.held = true; ball.vx = 0; ball.vy = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
  }
  function pointerMove(e) {
    if(!ball.held || !pointer) return;
    e.preventDefault();
    const p = getPoint(e);
    const dt = Math.max(1,p.t-pointer.t);
    const vx = (p.x-pointer.x)/dt*16.67;
    const vy = (p.y-pointer.y)/dt*16.67;
    pointer.vx = pointer.vx*.35 + vx*.65;
    pointer.vy = pointer.vy*.35 + vy*.65;
    pointer.x = p.x; pointer.y = p.y; pointer.t = p.t;
    ball.x = p.x; ball.y = p.y;
    ball.vx = pointer.vx; ball.vy = pointer.vy;
    spawnTrail(true);
  }
  function pointerUp(e) {
    if(!ball.held) return;
    e.preventDefault();
    ball.held = false;
    if(pointer) {
      ball.vx = clamp(pointer.vx,-34,34);
      ball.vy = clamp(pointer.vy,-34,34);
    }
    pointer = null;
  }
  canvas.addEventListener('pointerdown',pointerDown,{passive:false});
  canvas.addEventListener('pointermove',pointerMove,{passive:false});
  canvas.addEventListener('pointerup',pointerUp,{passive:false});
  canvas.addEventListener('pointercancel',pointerUp,{passive:false});
  window.addEventListener('resize',resize);

  function addParticle(x,y,vx,vy,life,size,color,type='fire') {
    if(particles.length > 900) particles.splice(0,particles.length-850);
    particles.push({x,y,vx,vy,life,max:life,size,color,type,rot:rand(0,Math.PI*2),vr:rand(-.12,.12)});
  }
  function spawnTrail(held=false) {
    const speed = hypot(ball.vx,ball.vy);
    const amount = Math.ceil((1+speed*.22)*cfg.particles*(held?.8:1));
    for(let i=0;i<amount;i++) {
      const angle = Math.atan2(ball.vy,ball.vx)+Math.PI+rand(-.65,.65);
      const power = rand(.4,2.2)+speed*.12;
      const color = cfg.hue ? `hsl(${(hue+rand(-35,35))%360} 100% ${rand(57,76)}%)` : (Math.random()<.45?'#fff0b0':Math.random()<.6?'#ffb34f':'#ff5738');
      addParticle(ball.x+Math.cos(angle)*ball.r*.6,ball.y+Math.sin(angle)*ball.r*.6,
        Math.cos(angle)*power-ball.vx*.08+rand(-.5,.5),Math.sin(angle)*power-ball.vy*.08+rand(-.5,.5),rand(.28,.7),rand(2,5)+speed*.12,color);
    }
    if(speed>3 && Math.random()<.7) addParticle(ball.x,ball.y,rand(-1,1),rand(-1,1),.24,rand(2,4),'#fff7d5','spark');
  }
  function burst(x,y,power) {
    const count = Math.floor((13+power*1.2)*cfg.particles);
    for(let i=0;i<count;i++) {
      const a = Math.PI*2*i/count+rand(-.12,.12), s = rand(1,4)+power*.16;
      const color = cfg.hue ? `hsl(${(hue+i*27)%360} 100% 67%)` : (i%3===0?'#fff2b8':i%3===1?'#ff9346':'#ff4b39');
      addParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(.35,.85),rand(2,5)+power*.08,color,'spark');
    }
    if(mode==='crazy') {
      for(let i=0;i<5;i++) effects.push({x,y,r:5+i*8,life:.65,max:.65,hue:(hue+i*55)%360,kind:'ring'});
      effects.push({x,y,r:12,life:.8,max:.8,hue:hue,kind:'glitch'});
    } else {
      effects.push({x,y,r:8,life:.38,max:.38,hue:0,kind:'ring'});
    }
    shake = Math.max(shake,cfg.shake+power*.16);
    flash.style.setProperty('--flash-x',(x/width*100)+'%');
    flash.style.setProperty('--flash-y',(y/height*100)+'%');
    flash.style.opacity = mode==='ultra' ? '.28' : '.15';
    setTimeout(()=>{flash.style.opacity='0';},70);
  }
  function update(dt) {
    elapsed += dt; hue = (hue+dt*85)%360;
    if(!ball.held) {
      ball.vy += cfg.gravity*dt;
      ball.x += ball.vx*dt*60;
      ball.y += ball.vy*dt*60;
      const left = ball.r, right = width-ball.r, top = ball.r, bottom = height-ball.r;
      let hitPower = 0, hitX=ball.x, hitY=ball.y;
      if(ball.x<left) { hitPower=Math.max(hitPower,Math.abs(ball.vx)); ball.x=left; ball.vx=Math.abs(ball.vx)*cfg.bounce; }
      else if(ball.x>right) { hitPower=Math.max(hitPower,Math.abs(ball.vx)); ball.x=right; ball.vx=-Math.abs(ball.vx)*cfg.bounce; }
      if(ball.y<top) { hitPower=Math.max(hitPower,Math.abs(ball.vy)); ball.y=top; ball.vy=Math.abs(ball.vy)*cfg.bounce; }
      else if(ball.y>bottom) { hitPower=Math.max(hitPower,Math.abs(ball.vy)); ball.y=bottom; ball.vy=-Math.abs(ball.vy)*cfg.bounce; }
      if(hitPower>1.1) { burst(ball.x,ball.y,hitPower); }
      ball.vx *= Math.pow(cfg.drag,dt*60);
      ball.vy *= Math.pow(cfg.drag,dt*60);
      if(Math.abs(ball.vx)<.018) ball.vx=0;
      if(Math.abs(ball.vy)<.018) ball.vy=0;
    }
    ball.speed = hypot(ball.vx,ball.vy);
    ball.spin += ball.speed*dt*.025;
    if(running && (ball.speed>.15 || ball.held) && Math.random()<Math.min(.98,(.15+ball.speed*.08)*dt*60)) spawnTrail();
    for(let i=particles.length-1;i>=0;i--) {
      const p=particles[i]; p.life-=dt; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60;
      p.vx*=Math.pow(.985,dt*60); p.vy*=Math.pow(.985,dt*60); p.vy-=.008*dt*60; p.size*=Math.pow(.992,dt*60); p.rot+=p.vr*dt*60;
      if(p.life<=0 || p.size<.15) particles.splice(i,1);
    }
    for(let i=effects.length-1;i>=0;i--) { effects[i].life-=dt; effects[i].r+=dt*(effects[i].kind==='glitch'?55:100); if(effects[i].life<=0) effects.splice(i,1); }
    shake *= Math.pow(.045,dt);
    if(shake<.08) shake=0;
    speedFill.style.width = (clamp(ball.speed/27,0,1)*100)+'%';
  }
  function drawBackground() {
    let bg;
    if(mode==='ultra') {
      bg=ctx.createRadialGradient(width*.5,height*.48,20,width*.5,height*.48,Math.max(width,height)*.8);
      bg.addColorStop(0,'#35151d'); bg.addColorStop(.45,'#1c101b'); bg.addColorStop(1,'#090811');
    } else if(mode==='crazy') {
      bg=ctx.createLinearGradient(0,0,width,height);
      bg.addColorStop(0,`hsla(${hue},55%,15%,1)`); bg.addColorStop(.5,`hsla(${(hue+115)%360},48%,12%,1)`); bg.addColorStop(1,`hsla(${(hue+230)%360},55%,12%,1)`);
    } else {
      bg=ctx.createRadialGradient(width*.5,height*.5,10,width*.5,height*.5,Math.max(width,height)*.8);
      bg.addColorStop(0,'#171b2e'); bg.addColorStop(.58,'#0d1020'); bg.addColorStop(1,'#070811');
    }
    ctx.fillStyle=bg; ctx.fillRect(0,0,width,height);
    if(mode==='ultra') {
      const g=ctx.createRadialGradient(width*.5,height*.5,0,width*.5,height*.5,Math.max(width,height)*.65);
      g.addColorStop(0,'#ff33230b');g.addColorStop(1,'#ff201a1f');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);
    }
    for(const s of stars) {
      const twinkle=.6+.4*Math.sin(elapsed*1.7+s.p);
      ctx.globalAlpha=s.a*twinkle; ctx.fillStyle=mode==='crazy'?`hsl(${(hue+s.p*50)%360} 100% 80%)`:'#c9d5ff';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle=mode==='ultra'?'#ff5b4520':mode==='crazy'?`hsla(${hue},90%,70%,.11)`:'#8290c012';
    ctx.lineWidth=1; const gap=48, offset=(elapsed*4)%gap;
    for(let x=gap-offset;x<width;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke();}
    for(let y=gap-offset;y<height;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}
    const vignette=ctx.createRadialGradient(width/2,height/2,Math.min(width,height)*.18,width/2,height/2,Math.max(width,height)*.72);
    vignette.addColorStop(0,'transparent'); vignette.addColorStop(1,mode==='ultra'?'#08030799':'#02030a9c');ctx.fillStyle=vignette;ctx.fillRect(0,0,width,height);
  }
  function drawEffects() {
    for(const e of effects) {
      const alpha=clamp(e.life/e.max,0,1);
      ctx.save(); ctx.globalAlpha=alpha;
      if(e.kind==='ring') {
        ctx.strokeStyle=mode==='crazy'?`hsl(${(e.hue+elapsed*120)%360} 100% 70%)`:'#ffac61';
        ctx.lineWidth=mode==='ultra'?3.5:2; ctx.shadowBlur=18;ctx.shadowColor=ctx.strokeStyle;
        ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
      } else {
        ctx.translate(e.x,e.y); ctx.rotate(elapsed*3);
        ctx.strokeStyle=`hsl(${(e.hue+elapsed*180)%360} 100% 70%)`;ctx.lineWidth=2;ctx.shadowBlur=18;ctx.shadowColor=ctx.strokeStyle;
        for(let k=0;k<4;k++){ctx.rotate(Math.PI/4);ctx.strokeRect(-e.r*.55,-e.r*.55,e.r*1.1,e.r*1.1);}
      }
      ctx.restore();
    }
  }
  function drawParticles() {
    for(const p of particles) {
      const alpha=clamp(p.life/p.max,0,1);
      ctx.save();ctx.globalAlpha=alpha;
      if(p.type==='spark') {
        ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(.7,p.size*.48);ctx.shadowBlur=12;ctx.shadowColor=p.color;
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.1,p.y-p.vy*2.1);ctx.stroke();
      } else {
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.2);
        g.addColorStop(0,p.color);g.addColorStop(.38,p.color);g.addColorStop(1,'transparent');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.2,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
  }
  function drawBall() {
    const speed=ball.speed;
    const pulse=1+Math.sin(elapsed*8)*.025+Math.min(speed/40,.12);
    const r=ball.r*pulse;
    const hueColor=cfg.hue?`hsl(${hue} 100% 65%)`:mode==='ultra'?'#ff4f3d':'#ff8741';
    ctx.save();
    // Long, speed-reactive tail glow.
    if(speed>.1) {
      const dx=-ball.vx/(speed||1),dy=-ball.vy/(speed||1);
      const length=(24+speed*8)*cfg.trail;
      const grad=ctx.createLinearGradient(ball.x,ball.y,ball.x+dx*length,ball.y+dy*length);
      grad.addColorStop(0,cfg.hue?`hsla(${hue},100%,70%,.48)`:'#ffb34b99');
      grad.addColorStop(.35,cfg.hue?`hsla(${(hue+35)%360},100%,60%,.22)`:'#ff5c3c55');
      grad.addColorStop(1,'transparent');
      ctx.strokeStyle=grad;ctx.lineWidth=r*(.8+Math.min(speed/12,1.5))*cfg.trail;ctx.lineCap='round';ctx.shadowBlur=24;ctx.shadowColor=hueColor;
      ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+dx*length,ball.y+dy*length);ctx.stroke();
    }
    // Flame tongues around the ball intensify with speed.
    const tongues=mode==='ultra'?12:mode==='crazy'?11:8;
    const intensity=clamp(speed/18,0,1);
    for(let i=0;i<tongues;i++) {
      const a=(Math.PI*2*i/tongues)+ball.spin*(i%2?1:-1)*.55;
      const wobble=Math.sin(elapsed*13+i*2.3)*.18;
      const reach=r*(1.08+intensity*(1.4+Math.sin(elapsed*17+i)*.35));
      const bx=ball.x+Math.cos(a)*r*.65,by=ball.y+Math.sin(a)*r*.65;
      const tx=ball.x+Math.cos(a+wobble)*reach,ty=ball.y+Math.sin(a+wobble)*reach;
      ctx.beginPath();ctx.moveTo(bx,by);
      ctx.quadraticCurveTo(ball.x+Math.cos(a+.25)*reach*1.18,ball.y+Math.sin(a+.25)*reach*1.18,tx,ty);
      ctx.strokeStyle=cfg.hue?`hsla(${(hue+i*24)%360},100%,${62+intensity*20}%,${.38+intensity*.42})`:i%3===0?'#fff0a0':i%3===1?'#ffb044':'#ff5039';
      ctx.lineWidth=Math.max(1.2,r*(.13+intensity*.13));ctx.lineCap='round';ctx.shadowBlur=15+speed*1.4;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();
    }
    // Outer aura.
    const aura=ctx.createRadialGradient(ball.x,ball.y,r*.2,ball.x,ball.y,r*(3.4+intensity*1.7));
    aura.addColorStop(0,cfg.hue?`hsla(${hue},100%,60%,.38)`:'#ff7b35a0');
    aura.addColorStop(.4,cfg.hue?`hsla(${(hue+30)%360},100%,55%,.17)`:'#ff4b2b35');aura.addColorStop(1,'transparent');
    ctx.fillStyle=aura;ctx.beginPath();ctx.arc(ball.x,ball.y,r*(3.4+intensity*1.7),0,Math.PI*2);ctx.fill();
    // Core with hot white center.
    const core=ctx.createRadialGradient(ball.x-r*.28,ball.y-r*.32,r*.08,ball.x,ball.y,r*1.08);
    if(cfg.hue){core.addColorStop(0,'#ffffff');core.addColorStop(.25,`hsl(${(hue+70)%360} 100% 78%)`);core.addColorStop(.62,`hsl(${hue} 100% 53%)`);core.addColorStop(1,`hsl(${(hue+310)%360} 100% 35%)`);}
    else {core.addColorStop(0,'#fffbd0');core.addColorStop(.25,'#fff0a0');core.addColorStop(.56,mode==='ultra'?'#ff9b45':'#ff9a43');core.addColorStop(.82,mode==='ultra'?'#f43b33':'#f34a2d');core.addColorStop(1,'#7d182a');}
    ctx.fillStyle=core;ctx.shadowBlur=28+speed*1.5;ctx.shadowColor=hueColor;
    ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Tiny specular highlight.
    ctx.save();ctx.globalAlpha=.75;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ball.x-r*.3,ball.y-r*.34,r*.19,r*.11,-.6,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function render() {
    ctx.save();
    if(shake>0) ctx.translate(rand(-shake,shake),rand(-shake,shake));
    drawBackground();drawEffects();drawParticles();drawBall();
    ctx.restore();
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt=lastTime?Math.min((now-lastTime)/1000,.033):.016;lastTime=now;
    if(running) update(dt); else { elapsed+=dt; hue=(hue+dt*35)%360; }
    render();
  }
  resize(); applyMode(mode); ball.x=width/2; ball.y=height/2;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
