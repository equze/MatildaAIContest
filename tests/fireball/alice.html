<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fireball</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #05060a;
        font-family: 'Segoe UI', system-ui, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
    }
    #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
    }
    /* Кнопка «Назад» */
    #backBtn {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        z-index: 30;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,.25);
        background: rgba(20, 22, 34, .65);
        backdrop-filter: blur(6px);
        color: #eef1ff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: background .2s, transform .1s;
    }
    #backBtn:hover { background: rgba(60, 64, 92, .8); }
    #backBtn:active { transform: scale(.94); }

    /* Меню режимов */
    #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at center, rgba(30,10,50,.55), rgba(5,6,10,.92));
        transition: opacity .35s, visibility .35s;
    }
    #menu.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #menu h1 {
        color: #ffdd55;
        font-size: clamp(34px, 9vw, 64px);
        letter-spacing: 4px;
        text-shadow: 0 0 22px rgba(255,120,20,.9), 0 0 60px rgba(255,60,0,.6);
        user-select: none;
    }
    #menu .hint {
        color: #aab;
        font-size: clamp(13px, 3.5vw, 16px);
        text-align: center;
        max-width: 82vw;
        line-height: 1.5;
    }
    .modeBtn {
        width: min(300px, 78vw);
        padding: 16px 20px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,.18);
        background: rgba(35, 38, 60, .75);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: transform .12s, box-shadow .2s, background .2s;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
    }
    .modeBtn small {
        font-size: 13px;
        font-weight: 400;
        color: #b9bedd;
        letter-spacing: 0;
    }
    .modeBtn:active { transform: scale(.96); }
    #btnBasic:hover  { box-shadow: 0 0 24px rgba(120,180,255,.5); background: rgba(50,70,110,.85); }
    #btnUltra:hover  { box-shadow: 0 0 28px rgba(255,60,40,.6);  background: rgba(110,30,30,.85); }
    #btnCrazy:hover  { box-shadow: 0 0 28px rgba(255,120,255,.5); background: rgba(80,30,110,.85); }

    /* Панель режима (в игре) */
    #hud {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        z-index: 25;
        display: flex;
        gap: 8px;
    }
    .hudBtn {
        padding: 8px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,.25);
        background: rgba(20, 22, 34, .65);
        backdrop-filter: blur(6px);
        color: #eef1ff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background .2s, transform .1s;
    }
    .hudBtn:active { transform: scale(.94); }
    .hudBtn:hover { background: rgba(60, 64, 92, .8); }

    #speedWrap {
        position: fixed;
        bottom: calc(14px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 25;
        width: min(46vw, 240px);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity .3s;
    }
    #speedWrap.show { opacity: 1; }
    #speedWrap .label {
        color: #cfd3ee;
        font-size: 12px;
        letter-spacing: 2px;
        margin-bottom: 4px;
        text-shadow: 0 1px 3px #000;
    }
    #speedBar {
        height: 6px;
        border-radius: 4px;
        background: rgba(255,255,255,.14);
        overflow: hidden;
    }
    #speedFill {
        height: 100%;
        width: 0%;
        border-radius: 4px;
        background: linear-gradient(90deg, #ffdd55, #ff8820, #ff3311);
        box-shadow: 0 0 10px rgba(255,120,30,.8);
        transition: width .1s linear;
    }
</style>
</head>
<body>

<canvas id="game"></canvas>

<a id="backBtn" href="../../index.html">‹ Назад</a>

<div id="menu">
    <h1>FIREBALL</h1>
    <div class="hint">Веди шарик пальцем или мышкой, отпусти — и он летит по инерции,<br>отскакивая от стен. Чем быстрее — тем эпичнее огонь.</div>
    <button class="modeBtn" id="btnBasic">BASIC<small>Классика: огонь, инерция, отскоки</small></button>
    <button class="modeBtn" id="btnUltra">ULTRA<small>Огромный шарик, красное поле, мощные удары</small></button>
    <button class="modeBtn" id="btnCrazy">CRAZY<small>Переливающиеся цвета и странные эффекты</small></button>
</div>

<div id="hud" style="display:none">
    <button class="hudBtn" id="btnMenu">Меню</button>
</div>

<div id="speedWrap">
    <div class="label">СКОРОСТЬ</div>
    <div id="speedBar"><div id="speedFill"></div></div>
</div>

<script>
(() => {
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const hud = document.getElementById('hud');
    const speedWrap = document.getElementById('speedWrap');
    const speedFill = document.getElementById('speedFill');

    let W = 0, H = 0, DPR = 1;
    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------------- Настройки режимов ----------------
    const MODES = {
        basic: {
            name: 'Basic',
            ballR: 26,
            hueBg: [225, 235],        // диапазон оттенков фона (синеватый)
            trailMax: 90,
            restitution: 0.72,        // потеря скорости при ударе
            shake: 6,
            followK: 0.22,            // насколько резко шарик догоняет палец
            maxFollowSpeed: 0,        // без ограничения
            grab: true,               // шарик приклеивается к пальцу
            chaos: 0
        },
        ultra: {
            name: 'Ultra',
            ballR: 44,
            hueBg: [0, 14],           // красноватое поле
            trailMax: 150,
            restitution: 0.92,        // отскакивает сильнее
            shake: 14,
            followK: 0.3,
            maxFollowSpeed: 0,
            grab: true,
            chaos: 0
        },
        crazy: {
            name: 'Crazy',
            ballR: 30,
            hueBg: [0, 360],          // переливы
            trailMax: 120,
            restitution: 0.8,
            shake: 9,
            followK: 0.25,
            maxFollowSpeed: 0,
            grab: true,
            chaos: 1                  // странные эффекты
        }
    };

    let mode = null;
    let running = false;

    // ---------------- Состояние игры ----------------
    const ball = {
        x: 0, y: 0,
        vx: 0, vy: 0,
        r: 26,
        grabbed: false
    };

    let pointer = { x: 0, y: 0, px: 0, py: 0, down: false, hasPrev: false };
    let trail = [];      // огненный след
    let sparks = [];     // искры/частицы
    let rings = [];      // волны от ударов
    let crazyShapes = [];// странные штуки для Crazy
    let shake = { t: 0, amp: 0 };
    let bgHue = 220;
    let bgHueTarget = 220;
    let ballHue = 25;
    let bgFlash = 0;     // вспышка при ударе
    let lastT = performance.now();

    function startGame(key) {
        mode = MODES[key];
        ball.r = mode.ballR;
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
        ball.grabbed = false;
        trail = [];
        sparks = [];
        rings = [];
        crazyShapes = [];
        bgHue = mode.hueBg[0];
        bgHueTarget = bgHue;
        running = true;
        menu.classList.add('hidden');
        hud.style.display = 'flex';
        speedWrap.classList.add('show');
        lastT = performance.now();
    }

    function toMenu() {
        running = false;
        menu.classList.remove('hidden');
        hud.style.display = 'none';
        speedWrap.classList.remove('show');
    }

    document.getElementById('btnBasic').addEventListener('click', () => startGame('basic'));
    document.getElementById('btnUltra').addEventListener('click', () => startGame('ultra'));
    document.getElementById('btnCrazy').addEventListener('click', () => startGame('crazy'));
    document.getElementById('btnMenu').addEventListener('click', toMenu);

    // ---------------- Ввод (мышь + тач через Pointer Events) ----------------
    function getPos(e) {
        return { x: e.clientX, y: e.clientY };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (!running) return;
        canvas.setPointerCapture(e.pointerId);
        const p = getPos(e);
        pointer.x = p.x; pointer.y = p.y;
        pointer.px = p.x; pointer.py = p.y;
        pointer.down = true;
        pointer.hasPrev = true;
        // хватаем шарик, если коснулись рядом с ним
        const dx = p.x - ball.x, dy = p.y - ball.y;
        if (Math.hypot(dx, dy) < ball.r + 60) {
            ball.grabbed = true;
            ball.vx = 0; ball.vy = 0;
        } else {
            // если ткнули далеко — просто тянем шарик к пальцу мягко
            ball.grabbed = true;
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!running || !pointer.down) return;
        const p = getPos(e);
        pointer.px = pointer.x; pointer.py = pointer.y;
        pointer.x = p.x; pointer.y = p.y;
        if (!pointer.hasPrev) { pointer.px = p.x; pointer.py = p.y; pointer.hasPrev = true; }
    });

    function release() {
        if (!running) return;
        if (ball.grabbed) {
            // скорость = средняя скорость пальца за последние кадры
            ball.vx = pointer.vxSmooth || 0;
            ball.vy = pointer.vySmooth || 0;
        }
        pointer.down = false;
        ball.grabbed = false;
        pointer.hasPrev = false;
        pointer.vxSmooth = 0;
        pointer.vySmooth = 0;
    }
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('pointerleave', (e) => { if (pointer.down) release(); });

    pointer.vxSmooth = 0;
    pointer.vySmooth = 0;

    // ---------------- Эффекты ----------------
    function addShake(amp) {
        shake.amp = Math.max(shake.amp, amp);
        shake.t = 1;
    }

    function spawnSparks(x, y, n, hue, power) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = (0.5 + Math.random()) * power;
            sparks.push({
                x, y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                life: 1,
                decay: 0.012 + Math.random() * 0.02,
                size: 2 + Math.random() * 4 * (1 + power / 40),
                hue: hue + (Math.random() * 40 - 20),
                chaos: mode.chaos ? Math.random() * 360 : 0
            });
        }
    }

    function spawnRing(x, y, hue) {
        rings.push({ x, y, r: ball.r * 0.6, maxR: ball.r * (3 + Math.random() * 3), life: 1, hue });
    }

    function spawnCrazyStuff(x, y, nx, ny) {
        // «странные» разноцветные эффекты: звёздочки, квадраты, радужные брызги
        const n = 10 + Math.floor(Math.random() * 10);
        for (let i = 0; i < n; i++) {
            const a = Math.atan2(ny, nx) + (Math.random() - 0.5) * 2.6;
            const sp = 2 + Math.random() * 9;
            crazyShapes.push({
                x, y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                rot: Math.random() * Math.PI * 2,
                vr: (Math.random() - 0.5) * 0.4,
                size: 4 + Math.random() * 10,
                hue: Math.random() * 360,
                shape: Math.random() < 0.5 ? 'star' : 'square',
                life: 1,
                decay: 0.01 + Math.random() * 0.02
            });
        }
        // радужная волна
        rings.push({ x, y, r: ball.r * 0.5, maxR: ball.r * 6, life: 1, hue: Math.random() * 360, rainbow: true });
    }

    function drawStar(x, y, r, rot) {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const a1 = rot + i * (Math.PI * 2 / 5);
            const a2 = a1 + Math.PI / 5;
            ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
            ctx.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
        }
        ctx.closePath();
        ctx.fill();
    }

    // ---------------- Обновление ----------------
    function update(dt) {
        const speedPxPerMs = 1; // dt в мс

        if (ball.grabbed && pointer.down) {
            // Плавное следование за пальцем + расчёт скорости броска
            const k = mode.followK;
            const nx = ball.x + (pointer.x - ball.x) * k;
            const ny = ball.y + (pointer.y - ball.y) * k;
            // скорость следования (для инерции после отпускания накапливаем сглаженную скорость пальца)
            const pvx = (pointer.x - pointer.px) / Math.max(dt, 1) * 16.7;
            const pvy = (pointer.y - pointer.py) / Math.max(dt, 1) * 16.7;
            pointer.vxSmooth = pointer.vxSmooth * 0.75 + pvx * 0.25;
            pointer.vySmooth = pointer.vySmooth * 0.75 + pvy * 0.25;
            ball.vx = (nx - ball.x) / Math.max(dt, 1) * 16.7;
            ball.vy = (ny - ball.y) / Math.max(dt, 1) * 16.7;
            ball.x = nx;
            ball.y = ny;
        } else {
            // полёт по инерции
            const fr = 0.999;      // лёгкое сопротивление воздуха
            ball.vx *= fr;
            ball.vy *= fr;
            ball.x += ball.vx * dt / 16.7;
            ball.y += ball.vy * dt / 16.7;
        }

        // Столкновения со стенами
        let bounced = false;
        let bnx = 0, bny = 0;
        const r = ball.r;
        if (ball.x - r < 0) { ball.x = r; ball.vx = Math.abs(ball.vx) * mode.restitution; bounced = true; bnx = 1; bny = 0; }
        else if (ball.x + r > W) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * mode.restitution; bounced = true; bnx = -1; bny = 0; }
        if (ball.y - r < 0) { ball.y = r; ball.vy = Math.abs(ball.vy) * mode.restitution; bounced = true; if (!bnx) { bnx = 0; bny = 1; } }
        else if (ball.y + r > H) { ball.y = H - r; ball.vy = -Math.abs(ball.vy) * mode.restitution; bounced = true; if (!bnx) { bnx = 0; bny = -1; } }

        const speed = Math.hypot(ball.vx, ball.vy);

        if (bounced) {
            const power = Math.min(speed, 60);
            if (power > 2) {
                bgFlash = Math.min(1, bgFlash + power / 50);
                addShake(mode.shake * Math.min(1, power / 30));
                const hue = mode.chaos ? Math.random() * 360 : (18 + Math.random() * 20);
                spawnSparks(ball.x - bnx * r, ball.y - bny * r,
                    Math.floor(8 + power * 1.2), hue, power * 0.5 + 4);
                spawnRing(ball.x - bnx * r, ball.y - bny * r, hue);
                if (mode.chaos) spawnCrazyStuff(ball.x - bnx * r, ball.y - bny * r, bnx, bny);
                if (mode.chaos) bgHueTarget = Math.random() * 360;
                // Crazy: шарик может дернуться вбок
                if (mode.chaos && Math.random() < 0.4) {
                    const ja = Math.random() * Math.PI * 2;
                    ball.vx += Math.cos(ja) * 4;
                    ball.vy += Math.sin(ja) * 4;
                }
            }
        }

        // Огненный след — интенсивность зависит от скорости
        const trailPower = Math.min(1, speed / 35);
        if (trailPower > 0.03 || ball.grabbed) {
            const n = 1 + Math.floor(trailPower * 3);
            for (let i = 0; i < n; i++) {
                trail.push({
                    x: ball.x + (Math.random() - 0.5) * ball.r * 0.8,
                    y: ball.y + (Math.random() - 0.5) * ball.r * 0.8,
                    r: ball.r * (0.35 + Math.random() * 0.5) * (0.5 + trailPower),
                    life: 1,
                    hue: mode.chaos ? (bgHue + Math.random() * 120) % 360 : 15 + Math.random() * 35
                });
            }
            if (trail.length > mode.trailMax) trail.splice(0, trail.length - mode.trailMax);
            // искры позади летящего шарика
            if (trailPower > 0.4 && Math.random() < trailPower) {
                const a = Math.atan2(-ball.vy, -ball.vx) + (Math.random() - 0.5);
                sparks.push({
                    x: ball.x, y: ball.y,
                    vx: Math.cos(a) * trailPower * 3,
                    vy: Math.sin(a) * trailPower * 3,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.03,
                    size: 1.5 + Math.random() * 3,
                    hue: mode.chaos ? Math.random() * 360 : 20 + Math.random() * 30,
                    chaos: 0
                });
            }
        }

        // Обновление частиц
        for (let i = trail.length - 1; i >= 0; i--) {
            const t = trail[i];
            t.life -= 0.028;
            t.r *= 0.985;
            if (t.life <= 0) trail.splice(i, 1);
        }
        for (let i = sparks.length - 1; i >= 0; i--) {
            const s = sparks[i];
            s.x += s.vx * dt / 16.7;
            s.y += s.vy * dt / 16.7;
            s.vx *= 0.96; s.vy *= 0.96;
            s.vy += 0.03; // лёгкая гравитация
            s.life -= s.decay;
            if (s.life <= 0) sparks.splice(i, 1);
        }
        for (let i = rings.length - 1; i >= 0; i--) {
            const g = rings[i];
            g.r += (g.maxR - g.r) * 0.12;
            g.life -= 0.03;
            if (g.life <= 0) rings.splice(i, 1);
        }
        for (let i = crazyShapes.length - 1; i >= 0; i--) {
            const c = crazyShapes[i];
            c.x += c.vx * dt / 16.7;
            c.y += c.vy * dt / 16.7;
            c.vx *= 0.97; c.vy *= 0.97;
            c.rot += c.vr;
            c.life -= c.decay;
            if (c.life <= 0) crazyShapes.splice(i, 1);
        }

        // Переливы цвета (Crazy)
        if (mode.chaos) {
            bgHue += (bgHueTarget - bgHue) * 0.03;
            if (Math.random() < 0.01) bgHueTarget = Math.random() * 360;
        } else {
            // лёгкий дрейф оттенка фона в диапазоне режима
            bgHueTarget = mode.hueBg[0] + Math.sin(performance.now() / 6000) * (mode.hueBg[1] - mode.hueBg[0]) / 2;
            bgHue += (bgHueTarget - bgHue) * 0.01;
        }

        // Затухание вспышки и тряски
        bgFlash *= 0.9;
        if (shake.t > 0) {
            shake.t -= dt / 220;
            if (shake.t <= 0) { shake.t = 0; shake.amp = 0; }
        }

        // Индикатор скорости
        const sp = Math.min(100, Math.round(speed / 40 * 100));
        speedFill.style.width = sp + '%';
    }

    // ---------------- Отрисовка ----------------
    function draw() {
        ctx.save();
        // Тряска экрана
        if (shake.t > 0) {
            const a = shake.amp * shake.t;
            ctx.translate((Math.random() - 0.5) * a * 2, (Math.random() - 0.5) * a * 2);
        }

        // Фон
        const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
        grad.addColorStop(0, `hsl(${bgHue}, 45%, ${11 + bgFlash * 10}%)`);
        grad.addColorStop(1, `hsl(${bgHue}, 55%, 4%)`);
        ctx.fillStyle = grad;
        ctx.fillRect(-30, -30, W + 60, H + 60);

        // Вспышка при ударе
        if (bgFlash > 0.02) {
            ctx.fillStyle = mode.chaos
                ? `hsla(${Math.random() * 360}, 80%, 60%, ${bgFlash * 0.18})`
                : `rgba(255, 140, 60, ${bgFlash * 0.22})`;
            ctx.fillRect(-30, -30, W + 60, H + 60);
        }

        // Волны от ударов
        for (const g of rings) {
            ctx.beginPath();
            ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
            ctx.strokeStyle = g.rainbow
                ? `hsla(${(g.hue + g.r * 3) % 360}, 100%, 60%, ${g.life * 0.7})`
                : `hsla(${g.hue}, 100%, 60%, ${g.life * 0.6})`;
            ctx.lineWidth = 3 * g.life + 1;
            ctx.stroke();
        }

        // Огненный след
        ctx.globalCompositeOperation = 'lighter';
        for (const t of trail) {
            const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, Math.max(t.r * t.life, 1));
            g.addColorStop(0, `hsla(${t.hue}, 100%, 65%, ${0.55 * t.life})`);
            g.addColorStop(0.5, `hsla(${t.hue - 15}, 100%, 50%, ${0.25 * t.life})`);
            g.addColorStop(1, 'hsla(0, 100%, 50%, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(t.x, t.y, Math.max(t.r * t.life, 1), 0, Math.PI * 2);
            ctx.fill();
        }

        // Искры
        for (const s of sparks) {
            ctx.globalAlpha = Math.max(0, s.life);
            ctx.fillStyle = `hsl(${s.chaos ? (s.hue + performance.now() / 10) % 360 : s.hue}, 100%, ${60 + 20 * s.life}%)`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Странные штуки (Crazy)
        for (const c of crazyShapes) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.rot);
            ctx.globalAlpha = Math.max(0, c.life);
            const hue = (c.hue + performance.now() / 8) % 360;
            if (c.shape === 'star') {
                ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
                drawStar(0, 0, c.size * c.life, 0);
            } else {
                ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
                ctx.lineWidth = 2;
                ctx.strokeRect(-c.size / 2 * c.life, -c.size / 2 * c.life, c.size * c.life, c.size * c.life);
            }
            ctx.restore();
        }
        ctx.globalAlpha = 1;

        // Пламя вокруг шарика — масштаб от скорости
        const speed = Math.hypot(ball.vx, ball.vy);
        const tp = Math.min(1, speed / 35);
        const flameR = ball.r * (1.4 + tp * 2.2);
        const fg = ctx.createRadialGradient(ball.x, ball.y, ball.r * 0.4, ball.x, ball.y, flameR);
        if (mode.chaos) {
            const h = (bgHue + 120) % 360;
            fg.addColorStop(0, `hsla(${h}, 100%, 70%, ${0.85})`);
            fg.addColorStop(0.4, `hsla(${(h + 60) % 360}, 100%, 55%, ${0.45 + tp * 0.3})`);
            fg.addColorStop(1, 'hsla(0, 100%, 50%, 0)');
        } else {
            fg.addColorStop(0, `rgba(255, 240, 180, ${0.85})`);
            fg.addColorStop(0.4, `rgba(255, 130, 30, ${0.5 + tp * 0.3})`);
            fg.addColorStop(1, 'rgba(255, 40, 0, 0)');
        }
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, flameR, 0, Math.PI * 2);
        ctx.fill();

        // Ядро шарика
        const coreHue = mode.chaos ? (bgHue + 180) % 360 : 30;
        const cg = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r);
        cg.addColorStop(0, '#ffffff');
        cg.addColorStop(0.55, `hsl(${coreHue}, 100%, 60%)`);
        cg.addColorStop(1, `hsl(${coreHue - 20}, 100%, 38%)`);
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();

        // Свечение ядра
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowColor = `hsla(${coreHue}, 100%, 60%, .9)`;
        ctx.shadowBlur = 25 + tp * 40;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r * 0.9, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,.25)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.restore();
    }

    // ---------------- Главный цикл ----------------
    function loop(now) {
        const dt = Math.min(40, now - lastT);
        lastT = now;
        if (running) {
            update(dt);
            draw();
        }
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Стартовый фон под меню
    (function idleBg() {
        const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
        grad.addColorStop(0, 'hsl(230, 45%, 11%)');
        grad.addColorStop(1, 'hsl(230, 55%, 4%)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    })();
})();
</script>
